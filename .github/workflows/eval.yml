name: eval

# Nightly quality check of the live Hub, and on every change that can affect answers.
# Needs two repository secrets: HUB_URL and HUB_API_KEY.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/instance/app.tf"
      - "evals/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r evals/requirements.txt
      - name: Run golden set
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_API_KEY: ${{ secrets.HUB_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python evals/run_eval.py --judge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
